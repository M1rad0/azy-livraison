name: ${COMPOSE_PROJECT_NAME:-azy-livraison}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-azy_livraison}
      POSTGRES_USER: ${POSTGRES_USER:-azy_dummy_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME_DUMMY_DATABASE_PASSWORD}
      TZ: ${APP_TIMEZONE:-Indian/Antananarivo}
    ports:
      - "${POSTGRES_EXPOSED_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      API_PORT: 8080
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-azy_livraison}
      POSTGRES_USER: ${POSTGRES_USER:-azy_dummy_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME_DUMMY_DATABASE_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-admin}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-CHANGE_ME_DUMMY_ADMIN_PASSWORD}
      JWT_ISSUER: ${JWT_ISSUER:-azy-livraison}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-CHANGE_ME_DUMMY_ACCESS_SECRET_AT_LEAST_32_CHARACTERS}
      JWT_ACCESS_TTL_MINUTES: ${JWT_ACCESS_TTL_MINUTES:-15}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-CHANGE_ME_DUMMY_REFRESH_SECRET_AT_LEAST_32_CHARACTERS}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-7}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      MAX_IMPORT_FILE_SIZE_MB: ${MAX_IMPORT_FILE_SIZE_MB:-10}
      NOMINATIM_BASE_URL: ${NOMINATIM_BASE_URL:-http://nominatim:8080}
      NOMINATIM_USER_AGENT: ${NOMINATIM_USER_AGENT:-AZY-Livraison/0.1 (contact@example.invalid)}
      GEOCODING_COUNTRY_CODE: ${GEOCODING_COUNTRY_CODE:-mg}
      GEOCODING_ACCEPT_LANGUAGE: ${GEOCODING_ACCEPT_LANGUAGE:-fr,mg,en}
      GEOCODING_RESULT_LIMIT: ${GEOCODING_RESULT_LIMIT:-5}
      GEOCODING_CONNECT_TIMEOUT: ${GEOCODING_CONNECT_TIMEOUT:-2s}
      GEOCODING_READ_TIMEOUT: ${GEOCODING_READ_TIMEOUT:-5s}
      GEOCODING_CACHE_TTL: ${GEOCODING_CACHE_TTL:-30d}
      OSRM_BASE_URL: ${OSRM_BASE_URL:-http://osrm:5000}
      OSRM_PROVIDER_PROFILE: ${OSRM_PROVIDER_PROFILE:-driving}
      ROUTING_PRESET: ${ROUTING_PRESET:-MAIN_ROADS}
      OSRM_MAX_TABLE_SIZE: ${OSRM_MAX_TABLE_SIZE:-100}
      OSRM_MAX_ROUTE_POINTS: ${OSRM_MAX_ROUTE_POINTS:-100}
      ROUTING_CONNECT_TIMEOUT: ${ROUTING_CONNECT_TIMEOUT:-2s}
      ROUTING_READ_TIMEOUT: ${ROUTING_READ_TIMEOUT:-30s}
      TZ: ${APP_TIMEZONE:-Indian/Antananarivo}
    ports:
      - "${API_EXPOSED_PORT:-8081}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres-data:
