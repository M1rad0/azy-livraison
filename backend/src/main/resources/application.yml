server:
  port: ${API_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: azy-livraison-api
  jackson:
    default-property-inclusion: non_null
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:azy_livraison}
    username: ${POSTGRES_USER:azy_dummy_user}
    password: ${POSTGRES_PASSWORD:CHANGE_ME_DUMMY_DATABASE_PASSWORD}
    hikari:
      connection-timeout: 5000
      maximum-pool-size: 10
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${MAX_IMPORT_FILE_SIZE_MB:10}MB
      max-request-size: ${MAX_IMPORT_FILE_SIZE_MB:10}MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    name: AZY Livraison API
    version: 0.1.0

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  auth:
    issuer: ${JWT_ISSUER:azy-livraison}
    access-secret: ${JWT_ACCESS_SECRET:CHANGE_ME_DUMMY_ACCESS_SECRET_AT_LEAST_32_CHARACTERS}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
    refresh-secret: ${REFRESH_TOKEN_SECRET:CHANGE_ME_DUMMY_REFRESH_SECRET_AT_LEAST_32_CHARACTERS}
    refresh-ttl-days: ${REFRESH_TOKEN_TTL_DAYS:7}
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
    initial-username: ${INITIAL_ADMIN_USERNAME:admin}
    initial-password: ${INITIAL_ADMIN_PASSWORD:CHANGE_ME_DUMMY_ADMIN_PASSWORD}
  imports:
    max-file-size: ${MAX_IMPORT_FILE_SIZE_MB:10}MB
  geocoding:
    base-url: ${NOMINATIM_BASE_URL:http://localhost:8082}
    user-agent: ${NOMINATIM_USER_AGENT:AZY-Livraison/0.1 (contact@example.invalid)}
    country-code: ${GEOCODING_COUNTRY_CODE:mg}
    accept-language: ${GEOCODING_ACCEPT_LANGUAGE:fr,mg,en}
    result-limit: ${GEOCODING_RESULT_LIMIT:5}
    connect-timeout: ${GEOCODING_CONNECT_TIMEOUT:2s}
    read-timeout: ${GEOCODING_READ_TIMEOUT:5s}
    cache-ttl: ${GEOCODING_CACHE_TTL:30d}
  routing:
    base-url: ${OSRM_BASE_URL:http://localhost:8083}
    provider-profile: ${OSRM_PROVIDER_PROFILE:driving}
    preset: ${ROUTING_PRESET:MAIN_ROADS}
    max-matrix-points: ${OSRM_MAX_TABLE_SIZE:100}
    max-route-points: ${OSRM_MAX_ROUTE_POINTS:100}
    connect-timeout: ${ROUTING_CONNECT_TIMEOUT:2s}
    read-timeout: ${ROUTING_READ_TIMEOUT:30s}
  optimization:
    time-limit: ${OPTIMIZATION_TIME_LIMIT:5s}
    vehicle-activation-penalty-meters: ${OPTIMIZATION_VEHICLE_ACTIVATION_PENALTY_METERS:1000}
  vehicle-presets:
    moto:
      max-weight-kg: ${VEHICLE_MOTO_DEFAULT_MAX_WEIGHT_KG:30}
      average-speed-kmh: ${VEHICLE_MOTO_DEFAULT_AVERAGE_SPEED_KMH:25}
    bicycle:
      max-weight-kg: ${VEHICLE_BICYCLE_DEFAULT_MAX_WEIGHT_KG:10}
      average-speed-kmh: ${VEHICLE_BICYCLE_DEFAULT_AVERAGE_SPEED_KMH:12}
