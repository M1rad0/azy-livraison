services:
  nominatim:
    image: mediagis/nominatim:5.3.2
    profiles: ["geography"]
    shm_size: 1gb
    environment:
      PBF_PATH: /nominatim/data/madagascar-latest.osm.pbf
      IMPORT_STYLE: full
      IMPORT_WIKIPEDIA: "false"
      UPDATE_MODE: none
      THREADS: ${NOMINATIM_IMPORT_THREADS:-2}
      GUNICORN_WORKERS: ${NOMINATIM_WORKERS:-2}
      NOMINATIM_PASSWORD: ${NOMINATIM_PASSWORD:-CHANGE_ME_DUMMY_NOMINATIM_PASSWORD}
      POSTGRES_SHARED_BUFFERS: ${NOMINATIM_POSTGRES_SHARED_BUFFERS:-512MB}
      POSTGRES_MAINTENANCE_WORK_MEM: ${NOMINATIM_POSTGRES_MAINTENANCE_WORK_MEM:-1GB}
      POSTGRES_AUTOVACUUM_WORK_MEM: ${NOMINATIM_POSTGRES_AUTOVACUUM_WORK_MEM:-256MB}
      POSTGRES_WORK_MEM: ${NOMINATIM_POSTGRES_WORK_MEM:-10MB}
      POSTGRES_EFFECTIVE_CACHE_SIZE: ${NOMINATIM_POSTGRES_EFFECTIVE_CACHE_SIZE:-2GB}
      TZ: ${APP_TIMEZONE:-Indian/Antananarivo}
    ports:
      - "${NOMINATIM_EXPOSED_PORT:-8082}:8080"
    volumes:
      - ./data/osm:/nominatim/data
      - nominatim-data:/var/lib/postgresql/16/main
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/status >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 30m
    restart: unless-stopped

volumes:
  nominatim-data:
