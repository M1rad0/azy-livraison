services:
  nominatim:
    image: mediagis/nominatim:5.3.2
    profiles: ["geography"]
    shm_size: 1gb
    environment:
      PBF_PATH: /nominatim/data/madagascar-latest.osm.pbf
      IMPORT_STYLE: full
      IMPORT_WIKIPEDIA: "false"
      UPDATE_MODE: none
      THREADS: ${NOMINATIM_IMPORT_THREADS:-2}
      GUNICORN_WORKERS: ${NOMINATIM_WORKERS:-2}
      WARMUP_ON_STARTUP: ${NOMINATIM_WARMUP_ON_STARTUP:-true}
      NOMINATIM_PASSWORD: ${NOMINATIM_PASSWORD:-CHANGE_ME_DUMMY_NOMINATIM_PASSWORD}
      POSTGRES_SHARED_BUFFERS: ${NOMINATIM_POSTGRES_SHARED_BUFFERS:-512MB}
      POSTGRES_MAINTENANCE_WORK_MEM: ${NOMINATIM_POSTGRES_MAINTENANCE_WORK_MEM:-1GB}
      POSTGRES_AUTOVACUUM_WORK_MEM: ${NOMINATIM_POSTGRES_AUTOVACUUM_WORK_MEM:-256MB}
      POSTGRES_WORK_MEM: ${NOMINATIM_POSTGRES_WORK_MEM:-10MB}
      POSTGRES_EFFECTIVE_CACHE_SIZE: ${NOMINATIM_POSTGRES_EFFECTIVE_CACHE_SIZE:-2GB}
      TZ: ${APP_TIMEZONE:-Indian/Antananarivo}
    ports:
      - "${NOMINATIM_EXPOSED_PORT:-8082}:8080"
    volumes:
      - ./data/osm:/nominatim/data
      - nominatim-data:/var/lib/postgresql/16/main
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/status >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 30m
    restart: unless-stopped

  osrm-prepare:
    image: ghcr.io/project-osrm/osrm-backend:v26.8.0-debian
    profiles: ["geography"]
    environment:
      OSRM_DATASET: ${OSRM_DATASET:-madagascar-latest}
      OSRM_PREPARE_THREADS: ${OSRM_PREPARE_THREADS:-2}
      OSRM_GRAPH_VERSION: main-roads-v1-osrm-26.8.0-debian
    volumes:
      - ./data/osm:/data
      - ./infrastructure/osrm:/profiles:ro
    entrypoint: ["/bin/bash", "/profiles/prepare.sh"]
    restart: "no"

  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v26.8.0-debian
    profiles: ["geography"]
    command:
      - osrm-routed
      - --algorithm
      - mld
      - --max-table-size
      - "${OSRM_MAX_TABLE_SIZE:-250}"
      - --max-viaroute-size
      - "${OSRM_MAX_ROUTE_POINTS:-250}"
      - "/data/${OSRM_DATASET:-madagascar-latest}.osrm"
    depends_on:
      osrm-prepare:
        condition: service_completed_successfully
    ports:
      - "${OSRM_EXPOSED_PORT:-8083}:5000"
    volumes:
      - ./data/osm:/data:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/5000'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

volumes:
  nominatim-data:
