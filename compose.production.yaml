services:
  postgres:
    # Le port défini dans compose.yaml est supprimé en production.
    ports: !reset []
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-azy_livraison}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required in production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in production}

  backend:
    # L'API n'est joignable que depuis le réseau Docker.
    ports: !reset []
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}

      POSTGRES_DB: ${POSTGRES_DB:-azy_livraison}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required in production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in production}

      # Frontend et API partagent le même origin public.
      CORS_ALLOWED_ORIGINS: https://${APP_DOMAIN:?APP_DOMAIN is required in production}

      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-admin}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?INITIAL_ADMIN_PASSWORD is required in production}

      JWT_ISSUER: ${JWT_ISSUER:-azy-livraison}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required in production}
      JWT_ACCESS_TTL_MINUTES: ${JWT_ACCESS_TTL_MINUTES:-15}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:?REFRESH_TOKEN_SECRET is required in production}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-7}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}

      # Spring doit respecter X-Forwarded-* envoyé par les reverse proxies.
      SERVER_FORWARD_HEADERS_STRATEGY: framework

      MAX_IMPORT_FILE_SIZE_MB: ${MAX_IMPORT_FILE_SIZE_MB:-10}
      MAX_MULTIPART_REQUEST_SIZE_MB: ${MAX_MULTIPART_REQUEST_SIZE_MB:-12}
      PAYMENT_PROOF_STORAGE_PATH: ${PAYMENT_PROOF_STORAGE_PATH:-/data/payment-proofs}
      PAYMENT_PROOF_MAX_FILE_SIZE_MB: ${PAYMENT_PROOF_MAX_FILE_SIZE_MB:-10}

      NOMINATIM_BASE_URL: ${NOMINATIM_BASE_URL:-http://nominatim:8080}
      NOMINATIM_USER_AGENT: ${NOMINATIM_USER_AGENT:?NOMINATIM_USER_AGENT is required in production}
      GEOCODING_COUNTRY_CODE: ${GEOCODING_COUNTRY_CODE:-mg}
      GEOCODING_ACCEPT_LANGUAGE: ${GEOCODING_ACCEPT_LANGUAGE:-fr,mg,en}
      GEOCODING_RESULT_LIMIT: ${GEOCODING_RESULT_LIMIT:-5}
      GEOCODING_CONNECT_TIMEOUT: ${GEOCODING_CONNECT_TIMEOUT:-2s}
      GEOCODING_READ_TIMEOUT: ${GEOCODING_READ_TIMEOUT:-30s}
      GEOCODING_CACHE_TTL: ${GEOCODING_CACHE_TTL:-30d}

      OSRM_BASE_URL: ${OSRM_BASE_URL:-http://osrm:5000}
      OSRM_PROVIDER_PROFILE: ${OSRM_PROVIDER_PROFILE:-driving}
      ROUTING_PRESET: ${ROUTING_PRESET:-MAIN_ROADS}
      OSRM_MAX_TABLE_SIZE: ${OSRM_MAX_TABLE_SIZE:-250}
      OSRM_MAX_ROUTE_POINTS: ${OSRM_MAX_ROUTE_POINTS:-250}
      ROUTING_CONNECT_TIMEOUT: ${ROUTING_CONNECT_TIMEOUT:-2s}
      ROUTING_READ_TIMEOUT: ${ROUTING_READ_TIMEOUT:-30s}

      # Ces variables sont lues par application.yml mais n'étaient pas
      # transmises par le compose.yaml local.
      VEHICLE_MOTO_DEFAULT_MAX_WEIGHT_KG: ${VEHICLE_MOTO_DEFAULT_MAX_WEIGHT_KG:-30}
      VEHICLE_MOTO_DEFAULT_AVERAGE_SPEED_KMH: ${VEHICLE_MOTO_DEFAULT_AVERAGE_SPEED_KMH:-25}
      VEHICLE_BICYCLE_DEFAULT_MAX_WEIGHT_KG: ${VEHICLE_BICYCLE_DEFAULT_MAX_WEIGHT_KG:-10}
      VEHICLE_BICYCLE_DEFAULT_AVERAGE_SPEED_KMH: ${VEHICLE_BICYCLE_DEFAULT_AVERAGE_SPEED_KMH:-12}

      OPTIMIZATION_TIME_LIMIT: ${OPTIMIZATION_TIME_LIMIT:-5s}
      OPTIMIZATION_VEHICLE_ACTIVATION_PENALTY_METERS: ${OPTIMIZATION_VEHICLE_ACTIVATION_PENALTY_METERS:-1000}
      OPTIMIZATION_PICKUP_SERVICE_DURATION: ${OPTIMIZATION_PICKUP_SERVICE_DURATION:-10m}
      OPTIMIZATION_HUB_TRANSFER_DURATION: ${OPTIMIZATION_HUB_TRANSFER_DURATION:-15m}
      OPTIMIZATION_DELIVERY_SERVICE_DURATION: ${OPTIMIZATION_DELIVERY_SERVICE_DURATION:-5m}
      OPTIMIZATION_DELIVERY_WINDOW_EARLY_TOLERANCE: ${OPTIMIZATION_DELIVERY_WINDOW_EARLY_TOLERANCE:-0m}
      OPTIMIZATION_DELIVERY_WINDOW_LATE_TOLERANCE: ${OPTIMIZATION_DELIVERY_WINDOW_LATE_TOLERANCE:-30m}

  frontend:
    # Le frontend n'est pas publié directement sur l'hôte en production.
    ports: !reset []
    # Remplace uniquement la config Nginx embarquée dans l'image en prod.
    volumes:
      - ./infrastructure/nginx/frontend.production.conf:/etc/nginx/conf.d/default.conf:ro

  edge:
    image: nginx:1.29-alpine
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required in production}
    entrypoint: ["/bin/sh", "/etc/nginx/edge-entrypoint.sh"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/edge-entrypoint.sh:/etc/nginx/edge-entrypoint.sh:ro
      - ./infrastructure/nginx/edge-http.conf.template:/etc/nginx/edge-http.conf.template:ro
      - ./infrastructure/nginx/edge-https.conf.template:/etc/nginx/edge-https.conf.template:ro
      - ./data/letsencrypt:/etc/letsencrypt:ro
      - ./data/certbot-www:/var/www/certbot:ro
    depends_on:
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nginx -t"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # À exécuter une seule fois pour le premier certificat :
  # docker compose ... --profile tls-bootstrap run --rm certbot-bootstrap
  certbot-bootstrap:
    image: certbot/certbot:v5.7.0
    profiles: ["tls-bootstrap"]
    volumes:
      - ./data/letsencrypt:/etc/letsencrypt
      - ./data/certbot-www:/var/www/certbot
    command:
      - certonly
      - --webroot
      - --webroot-path=/var/www/certbot
      - --non-interactive
      - --agree-tos
      - --no-eff-email
      - --email
      - ${LETSENCRYPT_EMAIL:?LETSENCRYPT_EMAIL is required in production}
      - -d
      - ${APP_DOMAIN:?APP_DOMAIN is required in production}

  # Renouvellement automatique. L'edge surveille le certificat et recharge
  # Nginx lorsqu'un nouveau certificat apparaît.
  certbot-renew:
    image: certbot/certbot:v5.7.0
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        trap exit TERM;
        while :; do
          certbot renew --webroot --webroot-path /var/www/certbot --quiet;
          sleep 12h & wait $$!;
        done
    volumes:
      - ./data/letsencrypt:/etc/letsencrypt
      - ./data/certbot-www:/var/www/certbot
    restart: unless-stopped
